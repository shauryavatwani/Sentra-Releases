# Builds SentraSetup.exe on a real Windows machine in the cloud.
#
# Why this exists: PyInstaller cannot cross-compile. A Windows installer can
# only be produced on Windows, and the development machine for this project is
# a Mac. GitHub gives every repository free Windows runners, so the build that
# would otherwise need a borrowed laptop happens here instead.
#
# Two ways to start it:
#   * Actions tab -> "Build Windows Installer" -> Run workflow   (manual)
#   * push a tag:  git tag v1.0.0 && git push origin v1.0.0      (release)
#
# A tag build also publishes a GitHub Release with the installer and the
# version.json the in-app updater reads. A manual run only uploads the
# installer as a downloadable artifact, so you can test a build without
# announcing it to every client that is already running Sentra.

name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the Release on a tag build

jobs:
  build:
    runs-on: windows-latest
    # The InsightFace download plus a torch install plus PyInstaller on a
    # multi-GB bundle is comfortably over the 30 minute default.
    timeout-minutes: 90

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      # numpy is pinned <2 (InsightFace's compiled extensions are built against
      # numpy 1.x — see the ABI notes in WINDOWS_BUILD.md). numpy 1.26.4 has no
      # wheels for Python 3.13+, so the version here is a hard requirement, not
      # a preference.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ~613MB of ONNX models. Cached because it is the slowest step by far and
      # it never changes between builds.
      - name: Restore the InsightFace model cache
        id: insightface-cache
        uses: actions/cache@v4
        with:
          path: ~/.insightface
          key: insightface-buffalo_l-v1

      - name: Install torch (CPU build)
        # From PyTorch's CPU index deliberately. The default PyPI torch on
        # Windows is the CUDA build: ~2.5GB, all of which would end up inside
        # the installer for no benefit, since the pose model runs on CPU.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install application dependencies
        run: |
          python -m pip install -r backend_v2/requirements.txt
          python -m pip install pyinstaller==6.11.1

      - name: Download the InsightFace models
        if: steps.insightface-cache.outputs.cache-hit != 'true'
        # Shipped inside the installer so the client PC needs no internet on
        # first run. Downloading here is what makes that possible.
        run: |
          python -c "from insightface.app import FaceAnalysis; a=FaceAnalysis(providers=['CPUExecutionProvider']); a.prepare(ctx_id=0, det_size=(320,320)); print('model set ready')"

      - name: Verify the pose model is present
        # yolov8n-pose.pt is committed to the repo. If it is missing the build
        # still succeeds and fight detection silently disables itself at
        # runtime — the exact failure mode this project keeps getting bitten
        # by, so fail loudly here instead.
        shell: pwsh
        run: |
          if (-not (Test-Path "Formal_Code/yolov8n-pose.pt")) {
            Write-Error "Formal_Code/yolov8n-pose.pt is missing. Fight detection would silently disable itself at runtime."
            exit 1
          }
          Write-Host "pose model present"

      - name: Build the application bundle
        run: python -m PyInstaller windows/sentra.spec --noconfirm --clean

      - name: Confirm the bundle was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Sentra/Sentra.exe")) {
            Write-Error "dist/Sentra/Sentra.exe was not produced."
            exit 1
          }
          Write-Host "bundle: dist/Sentra/Sentra.exe"

      - name: Self-test the built application
        # Runs inside the bundle that was just built, so it tests what will
        # actually ship rather than the CI environment. This exists because a
        # bundle missing torch.testing started fine, served the dashboard, and
        # had fight detection silently switched off — a build that looked
        # completely successful. Caught on macOS, where the app is testable
        # locally; the same exclusion was live in this spec.
        #
        # Start-Process -Wait because the exe is built windowed: a GUI process
        # returns to the shell immediately, so a bare invocation would neither
        # block nor surface its exit code. Its report goes to a log file for
        # the same reason — a windowed build has no stdout to print to.
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\dist\Sentra\Sentra.exe" `
                                -ArgumentList "--selftest" -Wait -PassThru
          $log = Join-Path $env:PROGRAMDATA "Sentra\.run_logs\selftest.log"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "no self-test log produced" }
          if ($proc.ExitCode -ne 0) {
            Write-Error "The built app failed its own self-test. Do NOT ship this build."
            exit 1
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        # $env:ProgramFiles(x86) is invalid PowerShell — "(x86)" after a bare
        # $env: variable is parsed as an operator, not part of the name, which
        # silently drops the space in "Program Files (x86)" and 404s the exe.
        # ${env:...} braces the name so it is taken literally.
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\sentra.iss'

      - name: Generate the release manifest
        # Computes the real sha256 of the installer just built. The client
        # refuses any download whose digest does not match, so this must never
        # be hand-written.
        run: python windows/make_release.py "https://github.com/${{ github.repository }}/releases/latest/download"

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content windows/output/version.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "built version $v"

      # Always available, tag build or not — this is how you get a test build
      # without publishing it to everyone already running Sentra.
      - name: Upload the installer as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentraSetup-${{ steps.version.outputs.version }}
          path: |
            windows/output/SentraSetup-*.exe
            windows/output/version.json
            windows/output/release_notes.md
          retention-days: 30

      # Only on a tag. version.json must land in the same release as the
      # installer it describes: a fresh installer paired with a stale manifest
      # is rejected by every client as an integrity failure.
      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Sentra ${{ steps.version.outputs.version }}
          body_path: windows/output/release_notes.md
          # SentraSetup.exe (unversioned) is the same bytes as the versioned
          # copy, published so that
          #   /releases/latest/download/SentraSetup.exe
          # is a permanent download link the README can point at without being
          # edited every release. The manifest still names the versioned copy —
          # see windows/make_release.py for why that distinction matters.
          files: |
            windows/output/SentraSetup.exe
            windows/output/SentraSetup-*.exe
            windows/output/version.json
            windows/output/release_notes.md
