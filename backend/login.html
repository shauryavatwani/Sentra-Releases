<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sentra — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0F14;
    --panel: #131A21;
    --panel-2: #1A222B;
    --border: #232D38;
    --border-strong: #303C49;
    --text: #E7ECF2;
    --text-muted: #8B97A6;
    --text-dim: #5D6A79;
    --teal: #2DD4BF;
    --teal-dim: #14554D;
    --amber: #F5A623;
    --amber-dim: #5C4213;
    --red: #E5484D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 14px;
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-card { width: 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 32px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--teal-dim); border: 1px solid var(--teal); display: flex; align-items: center; justify-content: center; }
  .brand-mark span { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
  .brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; }
  .brand-sub { font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.5px; text-transform: uppercase; margin-top: -2px; }
  .field-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; display: block; }
  .login-card input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border-strong);
    color: var(--text); padding: 11px 13px; border-radius: 8px; font-size: 13.5px;
    font-family: 'Inter', sans-serif; margin-bottom: 16px;
  }
  .login-card input:focus { outline: none; border-color: var(--teal); }
  .login-card button {
    width: 100%; background: var(--teal-dim); color: var(--teal); border: 1px solid var(--teal);
    padding: 11px 0; border-radius: 8px; font-weight: 600; font-size: 13.5px; cursor: pointer;
  }
  .login-card button:hover { background: #1B665C; }
  .login-card button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-msg { background: #3A1E1E; color: var(--red); font-size: 12.5px; padding: 9px 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
  .demo-hint {
    margin-top: 20px; padding: 12px 14px; border-radius: 8px;
    background: var(--amber-dim); border: 1px solid #8A6218; color: var(--amber);
    font-size: 12px; line-height: 1.6;
  }
  .demo-hint b { font-weight: 600; }
  .demo-hint .creds { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; display: block; margin-top: 4px; color: var(--text); }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark"><span></span></div>
      <div>
        <div class="brand-name">Sentra</div>
        <div class="brand-sub">CCTV Intelligence</div>
      </div>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form">
      <label class="field-label">Username</label>
      <input type="text" id="username" autocomplete="username" autofocus />
      <label class="field-label">Password</label>
      <input type="password" id="password" autocomplete="current-password" />
      <button type="submit" id="submit-btn">Sign in</button>
    </form>

    <div class="demo-hint">
      <b>Demo access</b> — for pitch purposes, so nobody gets locked out:
      <span class="creds">Username: sharktanktest &nbsp;·&nbsp; Password: demo</span>
    </div>
  </div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errorMsg = document.getElementById('error-msg');
  errorMsg.style.display = 'none';
  btn.disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      const data = await res.json().catch(() => ({}));
      errorMsg.textContent = data.detail || 'Sign in failed.';
      errorMsg.style.display = 'block';
    }
  } catch (err) {
    errorMsg.textContent = 'Could not reach the backend.';
    errorMsg.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
